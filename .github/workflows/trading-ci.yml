name: Trading Engine CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  trading-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile trading modules
        run: python -m compileall -q jarvis_core/trading
      - name: Run deterministic trading tests
        run: |
          set -o pipefail
          python -m unittest -v tests.test_trading_paper tests.test_trading_telegram 2>&1 | tee trading-test-output.txt
      - name: Upload trading test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trading-test-output
          path: trading-test-output.txt
          retention-days: 3
      - name: Validate installer shell
        run: bash -n tools/install_trading_agent.sh

name: Jarvis CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m compileall -q jarvis_core adapters/backtalk tools setup.py
      - name: Validate installer shell
        run: bash -n install.sh
